# Prefer applehv on macOS. Homebrew Podman 6.x passes --timesync to the
# VM helper; Podman Desktop's bundled krunkit (libkrun) may not accept it
# and exits 2 ("krunkit exited unexpectedly"). vfkit/applehv accepts
# --timesync. Create new machines after this is linked; existing libkrun
# machines keep their provider until recreated.
[machine]
provider = "applehv"
# Size for NEW machines. An existing one is changed with
# `podman machine set --cpus 6 --memory 12288`, which needs a stop and start.
# 6 GiB is too small for the Temporal, Postgres and Kafka stacks that integration tests start
# (the VM thrashed at a load average above 100). 12 GiB leaves ample room on a 32 GB Mac.
cpus = 6
memory = 12288
disk_size = 100

# podman compose delegates to an external provider. Use Homebrew podman-compose
# directly (not the ~/.local/bin/docker-compose shim) and silence the banner.
[engine]
compose_warning_logs = false
compose_providers = ["/opt/homebrew/bin/podman-compose"]
